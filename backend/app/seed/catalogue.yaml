- key: lifestyle.working_week
  title: The working week and weekend
  topic: workplace
  section: surprises
  summary: The UAE federal government works a four-and-a-half-day week, Monday to Thursday plus a half
    day on Friday, with Saturday and Sunday as the official weekend; the Abu Dhabi government has adopted
    a similar system.
  body_markdown: The UAE federal government works a four-and-a-half-day week, Monday to Thursday plus
    a half day on Friday, with Saturday and Sunday as the official weekend; the Abu Dhabi government has
    adopted a similar system.
