# ADAPT public catalogue: real Abu Dhabi organisations, places, events and guidance.
#
# Every row was verified on its `retrieved_at` date (2026-09-29, or 2026-10-01 for later
# additions) by loading its page (a few pages that block automated
# fetching were confirmed through search results instead). Summaries paraphrase only what
# the page says. There are no phone numbers, emails, prices or specific dates: recurring
# events carry a `timing_note` instead of invented dates.
#
# Shared by the catalogue seed (`python -m app.seed`: communities, events, cultural_guides)
# and offline research (`app/research/snapshot.py`). Extra keys:
#   binding: true   a binding legal rule stated on an official government page. The catalogue
#                   stores it as official_guidance; research shows it as "Law" only when the
#                   source is an official domain.
#   timing_note     usual timing of a recurring event (events have no verified dates).
# Tags drive personalisation: relocation:, profession:, interest:, background:, faith:.
# background: and interest: tags are only ever matched with community-personalisation
# consent; faith rows only with faith opt-in.

