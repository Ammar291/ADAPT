# Abu Dhabi governance graph: founder relocation journey (residency, family, health,
# company formation, ADGM, housing, transport, UAE PASS, healthcare access).
#
# NO CITATION, NO FACT. Every node and every relationship cites at least one passage from
# the curated official corpus (`corpus/*.yaml`) as `<source_key>#<passage_key>`. The loader
# (`app/knowledge/graph_seed.py`) rejects unresolvable citations, wrong endpoint types and
# dependency cycles. If a source does not state a relationship, it is not here, even when
# it seems obvious. Researched and curated 2026-09-29.
#
# Edge properties used by the requirement evaluator:
#   party: applicant (default) | sponsor | beneficiary | household
#          beneficiary facts are read with the `subject` prefix, e.g. `spouse.documents.passport`
#   when:  a condition; the requirement applies only when it holds (skipped when it cannot)
#   when_party: whose facts `when` reads, if not the edge's own party
#
# Nodes with `informational: true` are checked by the authority during processing: they
# are shown to the user but never block a plan.

version: 2

nodes:
  # ---------------------------------------------------------------- authorities
  - key: authority.icp
    type: authority
    label: Federal Authority for Identity, Citizenship, Customs & Port Security (ICP)
    summary: Federal authority that issues entry permits, residence permits, Emirates ID cards and establishment cards.
    official_url: https://icp.gov.ae
    publisher: authority.icp
    evidence: [uae.emirates_id#what_is, icp.issuing_establishment_card#channels_uae_pass_result]
  - key: authority.added
    type: authority
    label: Abu Dhabi Department of Economic Development (ADDED)
    summary: Licenses businesses on the Abu Dhabi mainland; its licensing services are offered through TAMM.
    official_url: https://www.added.gov.ae
    publisher: authority.added
    evidence: [added.licensing_requirements#apply_via_tamm, added.licensing_requirements#primary_services]
  - key: authority.adgm_ra
    type: authority
    label: ADGM Registration Authority
    summary: Registers, incorporates and licenses legal entities in Abu Dhabi Global Market and handles their government services.
    official_url: https://www.adgm.com/registration-authority
    publisher: authority.adgm
    evidence: [adgm.registration_authority#ra_role]
  - key: authority.adphc
    type: authority
    label: Abu Dhabi Public Health Centre (ADPHC)
    summary: With the Department of Health, sets and oversees the requirements of the visa screening programme.
    official_url: https://www.adphc.gov.ae
    publisher: authority.adphc
    evidence: [doh.standard_visa_screening_program#adphc_doh_role]
  - key: authority.doh
    type: authority
    label: Department of Health – Abu Dhabi (DoH)
    summary: Regulator of the healthcare sector and of the health insurance scheme in Abu Dhabi.
    official_url: https://www.doh.gov.ae
    publisher: authority.doh
    evidence: [doh.about#regulator_of_health_sector, doh.about#regulatory_framework]
  - key: authority.seha
    type: authority
    label: SEHA – Abu Dhabi Health Services Company
    summary: Government health-services company; its Ambulatory Healthcare Services run the visa Disease Prevention and Screening Centres.
    evidence: [doh.haad_new_visa_screening_centers#seha_ahs_operates_dpsc, uae.healthcare_providers#find_doctor_abu_dhabi]
  - key: authority.mofa
    type: authority
    label: UAE Ministry of Foreign Affairs (MoFA)
    summary: Attests official documents inside the UAE through digital channels and abroad through UAE missions.
    official_url: https://www.mofa.gov.ae
    publisher: authority.mofa
    evidence: [mofa.documents_attestation#about, uae.preparing_to_work#where_mofa_attests]
  - key: authority.adrec
    type: authority
    label: Abu Dhabi Real Estate Centre (ADREC)
    summary: Provides lease services (register, renew, modify, close or cancel tenancy contracts) and runs Tawtheeq registration.
    official_url: https://adrec.gov.ae
    publisher: authority.adrec
    evidence: [adrec.home#adrec_mandate, adrec.home#lease_services]
  - key: authority.ad_mobility
    type: authority
    label: Integrated Transport Centre (Abu Dhabi Mobility)
    summary: Provides driver and vehicle licensing, public buses (Hafilat) and the Darb toll system in Abu Dhabi.
    official_url: https://admobility.gov.ae
    publisher: authority.ad_mobility
    evidence: [admobility.driver_licensing_services#itc_provides_licensing]
  - key: authority.fta
    type: authority
    label: Federal Tax Authority (FTA)
    summary: Registers persons subject to UAE Corporate Tax and issues Corporate Tax Registration Numbers.
    official_url: https://tax.gov.ae
    publisher: authority.fta
    evidence: [fta.corporate_tax_registration#service_description]
  - key: authority.tdra
    type: authority
    label: Telecommunications and Digital Government Regulatory Authority (TDRA)
    summary: One of the government partners behind UAE PASS, the national digital identity.
    official_url: https://tdra.gov.ae
    publisher: authority.tdra
    evidence: [uae.uae_pass_app#operators]
  - key: authority.adro
    type: authority
    label: Abu Dhabi Residents Office (ADRO)
    summary: A division of ADDED that supports residents with visa services, guides for residents and Golden Visa nominations.
    official_url: https://www.adro.gov.ae
    publisher: authority.adro
    evidence: [adro.about#mandate, adro.about#services]
  - key: authority.addc
    type: authority
    label: Abu Dhabi Distribution Company (ADDC)
    summary: Delivers water and electricity services in Abu Dhabi.
    evidence: [adro.settling_into_abu_dhabi#utilities_after_tawtheeq]

  # ---------------------------------------------------------------- portals
  - key: portal.tamm
    type: portal
    label: TAMM
