    official_url: https://www.tamm.abudhabi
    publisher: authority.abu_dhabi_government
    properties: {requires_uae_pass: true}
    evidence: [uae.abu_dhabi_digital#tamm_one_stop_shop, uae.abu_dhabi_digital#tamm_channels, tamm.login#uae_pass_sign_in]
  - key: portal.icp_smart_services
    type: portal
    label: ICP smart services (website and UAEICP app)
    summary: ICP's online channels for visa, residence and Emirates ID services. Sign-in with UAE PASS.
    official_url: https://smartservices.icp.gov.ae
    publisher: authority.icp
    properties: {requires_uae_pass: true}
    evidence: [uae.where_to_apply_for_entry_permits#online_channels, icp.issuing_residency_permit#channels]
  - key: portal.icp_typing_centres
    type: portal
    label: ICP-registered typing centres
    summary: Offline channel where visa and Emirates ID applications are typed and submitted.
    publisher: authority.icp
    evidence: [uae.where_to_apply_for_entry_permits#typing_centres, icp.faq#visa_channels]
  - key: portal.icp_service_centres
    type: portal
    label: ICP customer happiness centres
    summary: ICP service centres, used for fingerprint and signature capture by appointment.
    publisher: authority.icp
    evidence: [icp.faq#appointment_biometrics, icp.chc_khalifa_city#about]
  - key: portal.icp_authorized_service_providers
    type: portal
    label: ICP authorised service providers
    summary: Applications for the establishment card are submitted exclusively through authorised service providers.
    publisher: authority.icp
    evidence: [icp.issuing_establishment_card#authorized_service_providers]
  - key: portal.mofa_digital
    type: portal
    label: MoFA website and UAE MOFA app
    summary: MoFA's attestation channels. Sign-in with UAE PASS.
    official_url: https://www.mofa.gov.ae
    publisher: authority.mofa
    properties: {requires_uae_pass: true}
    evidence: [mofa.faqs#channels, uae.preparing_to_work#mofa_channels, mofa.documents_attestation#uae_pass_and_channels]
  - key: portal.uae_missions_abroad
    type: portal
    label: UAE embassies and consulates abroad
    summary: Attest documents in the country that issued them, where the mission offers the service.
    publisher: authority.mofa
    evidence: [mofa.faqs#channels, mofa.documents_attestation#missions_availability]
  - key: portal.adgm_online_registry
    type: portal
    label: ADGM Online Registry Solution
    summary: ADGM's digital platform to register, incorporate and maintain companies online.
    official_url: https://www.adgm.com/operating-in-adgm/e-services/online-registry-solution
    publisher: authority.adgm
    evidence: [adgm.online_registry_solution#register_online, adgm.non_financial_incorporation_guide#digital_application]
  - key: portal.accessadgm
    type: portal
    label: ACCESSADGM
    summary: Portal through which the ADGM Registration Authority processes work permits for employees of ADGM entities.
    publisher: authority.adgm
    evidence: [adgm.ra_work_permit_guide#accessadgm_channel]
  - key: portal.emaratax
    type: portal
    label: FTA EmaraTax
    summary: FTA's online platform for tax registration. FTA services are only available through UAE PASS.
    official_url: https://tax.gov.ae
    publisher: authority.fta
    properties: {requires_uae_pass: true}
    evidence: [fta.corporate_tax_registration#channel_emaratax, fta.corporate_tax_registration#procedure_steps]
  - key: portal.municipal_customer_happiness_centres
    type: portal
    label: Municipality customer happiness centres
    summary: In-person channel for lease-contract services such as registration, renewal and cancellation.
    publisher: authority.dmt
    evidence: [dmt.aam_tawtheeq#lease_services_channels]
  - key: portal.seha_screening_centres
    type: portal
    label: SEHA Disease Prevention and Screening Centres
    summary: The listed eService for regular visa screening in Abu Dhabi.
    evidence: [uae.health_conditions_residence_visa#abu_dhabi_screening_eservice, doh.haad_new_visa_screening_centers#seha_ahs_operates_dpsc]
  - key: portal.certified_health_insurers
    type: portal
    label: DoH-certified health insurance companies
    summary: Where health insurance policies are bought or renewed.
    evidence: [doh.faq_flexible_health_insurance#how_to_subscribe, doh.faq_flexible_health_insurance#all_certified_insurers]
  - key: portal.uae_pass_app
    type: portal
    label: UAE PASS app
    summary: Register, verify your identity with face recognition, sign in to services and sign documents.
    official_url: https://dgov.tdra.gov.ae/services/uae-pass
    publisher: authority.tdra
    evidence: [tdra.uae_pass#how_to_register, uae.uae_pass_app#what_is_uae_pass]
  - key: portal.uae_pass_kiosk
    type: portal
    label: UAE PASS kiosks
    summary: Walk-in kiosks to register or verify a UAE PASS account with an Emirates ID.
    publisher: authority.tdra
    evidence: [tdra.uae_pass#how_to_register]
  - key: portal.darb
    type: portal
    label: Darb portal
    summary: Registration and account management for the Darb road-toll system.
    official_url: https://darb.itc.gov.ae
    publisher: authority.ad_mobility
    evidence: [admobility.darb#registration_portal]
  - key: portal.hafilat_sales_points
    type: portal
    label: Hafilat card sales points
    summary: Ticket machines, partner outlets and customer service offices that sell Hafilat cards.
    publisher: authority.ad_mobility
    evidence: [admobility.hafilat_smart_cards#anonymous_card_purchase_locations]
  - key: portal.emergency_998
    type: portal
    label: Ambulance – 998
    summary: Call 998 for an ambulance from anywhere in the UAE (999 police, 997 civil defence).
    evidence: [uae.handling_emergencies#ambulance_998, uae.handling_emergencies#emergency_numbers]
  - key: portal.ad999_app
    type: portal
    label: AD999 app (Abu Dhabi Police)
    summary: Report a fire, request an ambulance or call the emergency helpline in Abu Dhabi.
    evidence: [uae.handling_emergencies#ad999_app]
  - key: portal.seha_facility_finder
    type: portal
    label: SEHA doctor and facility finder
    summary: Search for doctors and healthcare facilities in Abu Dhabi.
    evidence: [uae.healthcare_providers#find_facility_abu_dhabi, uae.healthcare_providers#find_doctor_abu_dhabi]

  # ---------------------------------------------------------------- locations
  - key: location.abu_dhabi_mainland
    type: location
    label: Abu Dhabi mainland
    summary: Businesses with a standard ADDED economic licence practise across the Emirate of Abu Dhabi.
    publisher: authority.added
    evidence: [added.licensing_requirements#standard_licence]
  - key: location.adgm
    type: location
    label: Abu Dhabi Global Market (Al Maryah Island)
    summary: Financial free zone; an ADGM company needs a physical registered office here.
    publisher: authority.adgm
    evidence: [adgm.non_financial_incorporation_guide#physical_address]
  - key: location.icp_khalifa_city_centre
    type: location
    label: ICP Customer Happiness Center – Khalifa City A
    summary: One of ICP's main service centres in Abu Dhabi, offering fingerprint capture.
    publisher: authority.icp
    evidence: [icp.chc_khalifa_city#location, icp.chc_khalifa_city#services_offered]

  # ---------------------------------------------------------------- documents
  - key: document.passport
    type: document
    label: Passport
    summary: Valid for at least six months for visa and residence applications.
    evidence: [icp.faq#visa_general_documents, icp.issuing_residency_permit#validity_and_entry_window]
  - key: document.photo
    type: document
    label: Personal photo
    summary: Recent coloured photo with a white background (ICAO standard for the Emirates ID).
    evidence: [icp.faq#visa_general_documents, icp.new_identity_card_issuance#resident_documents_channels]
  - key: document.entry_permit
    type: document
    label: Entry permit
    summary: Entry permit issued to complete residence procedures; needed to register for visa screening.
    evidence: [icp.issuance_of_a_visa#about, doh.standard_visa_screening_program#registration_documents]
  - key: document.residence_visa
    type: document
    label: Residence permit
    summary: UAE residence permit, issued together with the Emirates ID application.
    evidence: [icp.issuing_residency_permit#about_and_steps, uae.general_provisions_residence_visa#validity]
  - key: document.emirates_id
    type: document
    label: Emirates ID
    summary: Identity card issued by ICP; a legal requirement for residents.
    evidence: [uae.emirates_id#what_is]
  - key: document.medical_fitness_certificate
    type: document
    label: Medical fitness certificate
    summary: Released after visa screening and sent to ICP.
    evidence: [doh.standard_visa_screening_program#fitness_certificate_sent_to_icp]
  - key: document.health_insurance_policy
    type: document
    label: Health insurance policy
    summary: Submitted by the sponsor when a residence permit is issued or renewed.
    evidence: [doh.health_insurance_law_23_2005#policy_needed_for_residence_permit]
  - key: document.marriage_certificate_attested
    type: document
    label: Attested marriage certificate
    summary: Proof of kinship for a spouse; foreign certificates are attested abroad and then by UAE MoFA.
    evidence: [icp.issuing_residency_permit#family_required_documents, mofa.faqs#personal_documents_in_scope]
  - key: document.birth_certificate_attested
    type: document
    label: Attested birth certificate
    summary: Proof of kinship and age for sponsored children.
    evidence: [icp.issuing_residency_permit#family_required_documents, uae.general_provisions_residence_visa#documents_dependent]
  - key: document.salary_certificate
    type: document
    label: Employment (salary) certificate
    summary: Shows the family's monthly income and housing provision.
    evidence: [icp.issuing_residency_permit#family_required_documents]
  - key: document.tenancy_contract_registered
    type: document
    label: Registered tenancy contract (Tawtheeq)
    summary: A lease registered in Tawtheeq, Abu Dhabi's register of tenancy contracts.
    evidence: [uae.leasing_a_property_in_the_uae#abu_dhabi_landlord_registers_tawtheeq]
  - key: document.property_ownership_proof
    type: document
    label: Proof of owning a residence
    summary: Accepted instead of a lease as proof of housing for family sponsorship.
    evidence: [uae.general_provisions_residence_visa#documents_sponsor_and_housing]
  - key: document.commercial_license
    type: document
    label: Company licence
    summary: The company's economic licence (mainland) or ADGM commercial licence.
    evidence: [added.establish_your_business#business_licence, icp.issuing_establishment_card#trade_licence]
  - key: document.trade_name_certificate
    type: document
    label: Trade name certificate
    summary: Issued when a trade name is registered with the economic department.
    evidence: [uae.steps_to_start_a_business_on_the_mainland#trade_name_registration]
  - key: document.initial_approval
    type: document
    label: Initial approval
    summary: Confirms the government has no objection to the business being established.
    evidence: [uae.steps_to_start_a_business_on_the_mainland#initial_approval_meaning]
  - key: document.commercial_tenancy_contract
    type: document
    label: Business premises tenancy contract
    summary: Lease for the business location, needed for a mainland licence.
    evidence: [added.establish_your_business#business_location, uae.steps_to_start_a_business_on_the_mainland#business_location]
  - key: document.memorandum_of_association
    type: document
    label: Memorandum of Association
    summary: Required for LLCs, limited partnerships, PJSCs and PrJSCs.
    evidence: [uae.steps_to_start_a_business_on_the_mainland#moa_lsa]
  - key: document.articles_of_association
    type: document
    label: Articles of Association (ADGM)
    summary: Model, amended or bespoke articles filed with an ADGM incorporation.
    evidence: [adgm.non_financial_incorporation_guide#documents_to_prepare]
  - key: document.incorporation_resolution
    type: document
    label: Incorporation resolution (ADGM)
    summary: Resolution appointing signatories and directors (template available).
    evidence: [adgm.non_financial_incorporation_guide#documents_to_prepare]
  - key: document.adgm_office_lease
    type: document
    label: Signed ADGM office lease
    summary: Lease for the registered office in ADGM, uploaded with the incorporation application.
    evidence: [adgm.non_financial_incorporation_guide#documents_to_prepare, adgm.non_financial_incorporation_guide#physical_address]
  - key: document.establishment_card
    type: document
    label: Establishment card
    summary: Electronic card with the establishment's registered data, issued by ICP.
    evidence: [icp.issuing_establishment_card#about]
  - key: document.corporate_tax_registration_number
    type: document
    label: Corporate Tax Registration Number
    summary: Issued by the FTA on corporate tax registration.
    evidence: [fta.corporate_tax_registration#service_description]
  - key: document.partnership_or_investment_agreement
    type: document
    label: Partnership or investment agreement
    summary: Required for the Green Residence investor category.
    evidence: [icp.issuing_residency_permit#green_investor_documents]
  - key: document.incubator_nomination
    type: document
    label: Business incubator nomination
    summary: Required for every entrepreneur route to the Golden Visa.
    evidence: [adro.golden_visa_entrepreneurs#incubator_nomination]
  - key: document.uae_driving_licence
    type: document
    label: UAE driving licence
    evidence: [tamm.get_a_driving_licence_journey#replace_foreign_licence, tamm.get_a_driving_licence_journey#issue_licence_after_test]
  - key: document.eye_test_report
    type: document
    label: Eye test report
    summary: From a centre approved by the traffic department; needed to open a driving file.
    evidence: [uae.getting_a_driving_licence#traffic_file_documents]

  # ---------------------------------------------------------------- requirements
  - key: requirement.family_accommodation
    type: requirement
    label: Adequate housing for the family
    summary: Owned or rented housing in proportion to the property's capacity, shown by a certified lease or proof of ownership.
    properties:
      condition:
        any:
          - {fact: documents.tenancy_contract_registered, op: truthy}
          - {fact: documents.property_ownership_proof, op: truthy}
    evidence: [icp.issuing_residency_permit#adequate_housing, uae.general_provisions_residence_visa#documents_sponsor_and_housing]
  - key: requirement.security_check
    type: requirement
    label: Security check
    summary: Residence visa applicants must pass a security check.
    properties: {informational: true, note: "ICP runs the security check while processing the application."}
    evidence: [uae.general_provisions_residence_visa#medical_test_security_eid]
  - key: requirement.emirates_id_application
    type: requirement
    label: Emirates ID application (unified with the residence permit)
    summary: Residence permit and Emirates ID are completed through one unified application.
    properties: {informational: true, note: "Part of the same ICP application: nothing to do separately."}
    evidence: [adro.types_of_visas#residence_visa_requirements, icp.new_identity_card_issuance#resident_unified_application]
  - key: requirement.free_of_communicable_diseases
    type: requirement
    label: Free of communicable diseases
    summary: Residence applicants must be free of communicable diseases such as HIV and TB; Abu Dhabi screens for TB with a chest X-ray.
    properties: {informational: true, note: "Determined by the visa screening; nothing to prepare in advance."}
    evidence: [uae.health_conditions_residence_visa#free_of_communicable_diseases, uae.health_conditions_residence_visa#abu_dhabi_chest_xray]
  - key: requirement.signatory_eid_or_unified_number
    type: requirement
    label: Authorised signatory's Emirates ID or Unified Number
    summary: A valid Emirates ID, or a Unified Number for visitors without one, for one of the authorised signatories.
    evidence: [icp.issuing_establishment_card#signatory_eid_or_unified_number]
  - key: requirement.free_zone_authority_submission
    type: requirement
    label: Apply through the free zone authority
    summary: Free zone companies submit the establishment card request through their free zone authority.
    properties: {informational: true, note: "For ADGM companies the request goes through ADGM."}
    evidence: [icp.issuing_establishment_card#free_zone_companies]
  - key: requirement.foreign_investor_residency_approval
    type: requirement
    label: Residency directorate approval for foreign investors
    summary: Foreign investors need approval from the General Directorate of Residency and Foreigners' Affairs before the initial approval.
    evidence: [uae.steps_to_start_a_business_on_the_mainland#initial_approval_prerequisites]
  - key: requirement.activity_approvals
    type: requirement
    label: Activity-specific approvals
    summary: Some activities need approvals from other entities, such as the Municipality or the Department of Health.
    evidence: [added.establish_your_business#additional_approvals, uae.steps_to_start_a_business_on_the_mainland#initial_approval_prerequisites]
  - key: requirement.home_country_attestation
    type: requirement
    label: Attested by the issuing country's foreign ministry
    summary: A foreign document is first attested by the Ministry of Foreign Affairs of the country that issued it.
    evidence: [mofa.faqs#issued_outside_uae_chain, uae.preparing_to_work#issued_outside_uae]
  - key: requirement.attestation_document_rules
    type: requirement
    label: Document rules for attestation
    summary: The original in Arabic or English (or with an official translation), attested by the right authorities.
    evidence: [mofa.faqs#attestation_requirements]
  - key: requirement.uae_mobile_number
    type: requirement
    label: Active UAE mobile number
    summary: Needed with a valid Emirates ID to register for UAE PASS as a resident.
    evidence: [tdra.uae_pass#eligibility_citizens_residents]
  - key: requirement.active_traffic_file
    type: requirement
    label: Active traffic file
    summary: TAMM licensing transactions need UAE PASS and an active traffic file in the licensing system.
    evidence: [admobility.driver_licensing_services#tamm_uae_pass_traffic_file]

  # ---------------------------------------------------------------- eligibility rules
  - key: eligibility_rule.family_sponsor_income
    type: eligibility_rule
    label: Sponsor's minimum income
    summary: The sponsor earns at least AED 4,000 a month, or AED 3,000 plus employer-provided housing.
    official_url: https://icp.gov.ae/en/services-details/?serviceid=64afe3c1035448005bd52e64
    properties:
      condition:
        any:
          - {fact: finance.monthly_income_aed, op: gte, value: 4000}
          - all:
              - {fact: finance.monthly_income_aed, op: gte, value: 3000}
              - {fact: housing.accommodation_provided, op: eq, value: true}
    evidence: [icp.issuing_residency_permit#financial_solvency, uae.residence_visa_for_family_members#sponsor_income]
  - key: eligibility_rule.family_eligible_members
    type: eligibility_rule
    label: Who a resident can sponsor
    summary: A spouse, unmarried daughters, sons under 25, and children with special needs.
    properties:
      condition:
        any:
          - {fact: person.relationship_to_sponsor, op: eq, value: spouse}
          - all:
              - {fact: person.relationship_to_sponsor, op: eq, value: daughter}
              - {fact: person.married, op: eq, value: false}
          - all:
              - {fact: person.relationship_to_sponsor, op: eq, value: son}
              - {fact: person.age, op: lt, value: 25}
          - all:
              - {fact: person.relationship_to_sponsor, op: in, value: [son, daughter]}
              - {fact: person.special_needs, op: eq, value: true}
    evidence: [icp.issuing_residency_permit#family_eligible_members, uae.residence_visa_for_family_members#eligible_family_members]
  - key: eligibility_rule.adgm_signatory_residency
    type: eligibility_rule
    label: A resident authorised signatory (ADGM)
    summary: At least one authorised signatory is a GCC national or holds a valid UAE residence visa.
    properties:
      condition: {fact: company.has_resident_signatory, op: eq, value: true}
    evidence: [adgm.non_financial_incorporation_guide#signatory_residency]
  - key: eligibility_rule.foreign_ownership
    type: eligibility_rule
    label: Activity open to foreign ownership
    summary: Foreign investors may fully own most mainland companies; the Cabinet restricts some strategic activities.
    evidence: [uae.full_foreign_ownership_of_commercial_companies#full_ownership, uae.full_foreign_ownership_of_commercial_companies#restricted_activities]
  - key: eligibility_rule.trade_name_rules
    type: eligibility_rule
    label: Trade name rules
    summary: Carries the legal-form suffix, respects public morals, is unique and matches the activity.
    evidence: [uae.steps_to_start_a_business_on_the_mainland#trade_name_rules]
  - key: eligibility_rule.green_investor_contribution
    type: eligibility_rule
    label: Investor contribution of at least AED 1,000,000
    summary: For the Green Residence investor category, the contribution to the company is at least AED 1 million in cash or equivalent.
    properties:
      condition: {fact: company.investment_aed, op: gte, value: 1000000}
    evidence: [icp.issuing_residency_permit#green_investor_contribution]
  - key: eligibility_rule.golden_visa_entrepreneur
    type: eligibility_rule
    label: Golden Visa entrepreneur criteria
    summary: An approved pioneering project, a qualifying SME, or a founder of sold projects, nominated by a UAE business incubator.
    evidence: [adro.golden_visa_entrepreneurs#eligibility]
  - key: eligibility_rule.minimum_driving_age
    type: eligibility_rule
    label: Minimum age for a car licence
    summary: 18 for cars and light vehicles (17 motorcycles, 20 heavy vehicles, 21 buses).
    properties:
      condition: {fact: person.age, op: gte, value: 18}
    evidence: [uae.getting_a_driving_licence#minimum_age]
  - key: eligibility_rule.licence_exchange
    type: eligibility_rule
    label: Licence eligible for exchange
    summary: A valid licence from an eligible country (GCC or designated countries), and the holder is at least 18.
    properties:
      condition:
        all:
          - {fact: driving.licence_exchangeable, op: eq, value: true}
          - {fact: person.age, op: gte, value: 18}
    evidence: [uae.getting_a_driving_licence#exchange_home_country_licence, tamm.get_a_driving_licence_journey#replace_foreign_licence]

  # ---------------------------------------------------------------- dependencies (OR groups)
  - key: dependency.company_licence
    type: dependency
    label: A company licence (Abu Dhabi mainland or ADGM)
    summary: Satisfied by either a mainland economic licence or ADGM incorporation.
    evidence: [icp.issuing_establishment_card#trade_licence, fta.corporate_tax_registration#required_documents]

  # ---------------------------------------------------------------- appointments
  - key: appointment.visa_screening
    type: appointment
    label: Visa screening visit
    summary: Registration, physical examination, blood test and chest X-ray at an approved screening provider.
    evidence: [doh.standard_visa_screening_program#tests_and_steps, doh.standard_visa_screening_program#approved_provider_only]
  - key: appointment.emirates_id_biometrics
    type: appointment
    label: Emirates ID fingerprints and signature
    summary: Applicants aged 15 and over attend an ICP service centre at their booked appointment.
    evidence: [icp.new_identity_card_issuance#biometrics_step, icp.new_identity_card_issuance#resident_appointment, icp.faq#appointment_biometrics]
  - key: appointment.uae_mission_visit
    type: appointment
    label: Visit to the UAE mission
    summary: Needed where the UAE mission abroad does not offer attestation online.
    evidence: [mofa.documents_attestation#missions_availability]
  - key: appointment.eye_test
    type: appointment
    label: Eye test
    summary: At an optician or centre approved by the traffic department.
    evidence: [uae.getting_a_driving_licence#learning_to_drive_process, tamm.get_a_driving_licence_journey#supporting_tools]
  - key: appointment.driving_test
    type: appointment
    label: Driving test
    evidence: [tamm.get_a_driving_licence_journey#driving_test_appointment]

  # ---------------------------------------------------------------- legal instruments
  - key: legal_instrument.health_insurance_law_2005
