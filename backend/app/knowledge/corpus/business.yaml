# Business cluster: company formation on the Abu Dhabi mainland (ADDED / u.ae), incorporation
# in ADGM (Registration Authority), ADGM employee work permits / visa prerequisites, UAE
# corporate tax registration (FTA / EmaraTax), and the ADRO Golden Visa route for entrepreneurs.
# Every URL below was loaded on retrieved_at (or, for `search_snippet` records, appeared verbatim
# in search results because adgm.com HTML pages sit behind a Cloudflare challenge). `quote`
# passages are verbatim (whitespace normalised); `paraphrase` passages stay within what the page
# says. No fees, fines, processing times, penalty amounts or capital/revenue amounts are recorded.
# TAMM service pages (tamm.abudhabi) render as empty JavaScript shells and could not be read.

sources:
  # --- Abu Dhabi mainland: ADDED -------------------------------------------------------
  - key: added.establish_your_business
    title: "Establishing your business"
    url: https://www.added.gov.ae/en/set-up/establish-your-business
    authority: authority.added
    source_type: guidance_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: 2026-09-24
    topics: [company_formation]
    verification: fetched
    notes: >-
      The identical stamp "Page was last updated on: 24 Sep 2026 11:56:33 AM" also appears on
      other ADDED pages, so it may be a site-wide publish time rather than a page-specific edit.
    passages:
      - key: business_activity
        section: "Business activity"
        excerpt: quote
        states_requirement: true
        text: >-
          Determining the nature of your business activity is the first step to getting your
          business legally recognised under one of the six types of licences available:
          industrial, commercial, professional, tourism, agricultural or occupational.
      - key: trade_name
        section: "Trade name"
        excerpt: quote
        states_requirement: true
        text: >-
          Remember to choose a unique name that resonates with your business and register it
          with ADDED.
      - key: initial_approval
        section: "Initial approval"
        excerpt: quote
        states_requirement: true
        text: >-
          Simultaneously, you must apply for an initial approval from ADDED which will help you
          proceed further and launch your business faster
      - key: contractual_agreements
        section: "Contractual agreements"
        excerpt: quote
        states_requirement: false
        text: >-
          Depending on your legal form and ownership criteria, you may need to draft a
          Memorandum of Association (MOA) or a Local Service Agent Agreement (LSA).
      - key: business_location
        section: "Business location"
        excerpt: quote
        states_requirement: true
        text: >-
          Next, you must find a suitable business location and obtain a tenancy contract. Learn
          more about Office Space and Renting.
      - key: additional_approvals
        section: "Additional Approvals"
        excerpt: quote
        states_requirement: false
        text: >-
          Depending on your activity and location, you may need additional approvals from other
          entities, such as the Abu Dhabi Municipality, the Department of Health, the Abu Dhabi
          Tourism Authority, etc.
      - key: business_licence
        section: "Business licence"
        excerpt: quote
        states_requirement: false
        text: >-
          Submitted all the required documents and paid the fees? Congratulations, you’re ready
          to obtain your final business licence!
      - key: online_via_tamm
        section: "Office space and rental"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          ADDED says that, as an alternative to the step-by-step process, investors can use its
          platforms such as TAMM to start a business online and get the licence. Its office-space
          guidance lists finding premises, verifying that the location and premises comply with
          business requirements in the Emirate of Abu Dhabi, and obtaining a rental agreement or
          tenancy contract (which validates the right to operate on the premises); a business that
          does not need physical premises can get a licence to operate online through TAMM.

  - key: added.licensing_requirements
    title: "Licensing Requirements"
    url: https://www.added.gov.ae/en/set-up/establish-your-business/licensing-requirements
    authority: authority.added
    source_type: guidance_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: 2026-09-24
    topics: [company_formation]
    verification: fetched
    notes: >-
      Same site-wide-looking "last updated" stamp as added.establish_your_business.
    passages:
      - key: apply_via_tamm
        section: "Licensing Requirements"
        excerpt: quote
        states_requirement: false
        text: >-
          ADDED streamlines the processing of licenses and permits required to engage in
          commercial activities. You can choose from and apply for the licenses you need through
          our eServices on TAMM.
      - key: primary_services
        section: "Primary and secondary licensing services"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          ADDED lists its primary licensing services as reserving a trade name, issuing an
          economic licence, renewing an economic licence, cancelling an economic licence, amending
          an economic licence and mortgaging an economic licence.
      - key: standard_licence
        section: "Types of Economic Licences"
        excerpt: quote
        states_requirement: false
        text: >-
          This is a standard economic licence that permits practicing a business in the Emirate
          of Abu Dhabi. This licence accommodates all legal forms of business and adheres to
          traditional procedures of establishing a business.
      - key: freelancer_licence
        section: "Types of Economic Licences"
        excerpt: quote
        states_requirement: false
        text: >-
          This licence is available for investors (citizens and foreigners) to practice economic
          activities in specific fields, remotely without the need for physical office premises.
      - key: virtual_licence
        section: "Types of Economic Licences"
        excerpt: quote
        states_requirement: false
        text: >-
          This is an economic licence for individuals residing outside the country who wish to
          start a business in Abu Dhabi.
      - key: dual_licence
        section: "Types of Economic Licences"
        excerpt: quote
        states_requirement: false
        text: >-
          This licence allows establishments registered in the free zones of Abu Dhabi to carry
          out their activities and manage their business outside the free zones area.
      - key: abu_dhabi_trader_licence
        section: "Types of Economic Licences"
        excerpt: quote
        states_requirement: false
        text: >-
          This licence is issued electronically for specific commercial activities to UAE
          citizens and residents.

  # --- Mainland: UAE Government portal ---------------------------------------------------
  - key: uae.steps_to_start_a_business_on_the_mainland
    title: "Steps to start a business on the mainland"
    url: https://u.ae/en/information-and-services/business/Doing-business/doing-business-on-the-mainland/steps-to-start-a-business-on-the-mainland
    authority: authority.uae_government
    source_type: guidance_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: 2026-07-16
    topics: [company_formation]
    verification: fetched
    notes: >-
      Federal, emirate-generic page. Its licence document list includes a Dubai-specific item
      (lease attested by RERA) and its local-service-agent note may be out of date relative to
      u.ae's own full-foreign-ownership page (uae.full_foreign_ownership_of_commercial_companies).
    passages:
      - key: standard_process_steps
        section: "Starting a business through the standard process"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          Starting a business on the mainland the conventional way involves identifying a
          business activity, selecting an appropriate legal form, applying for a trade licence,
          registering the trade name, applying for an initial approval, drafting a Memorandum of
          Association and local service agent agreement, selecting a location to conduct
          business, getting additional government approvals, and submitting documents and paying
          fees.
      - key: trade_name_registration
        section: "Registering the trade name"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          An investor applies for the trade name through the economic department of each
          emirate, via its website or mobile application. The local department of economic
          development registers the trade name, while the Ministry of Economy and Tourism
          registers the trademark. Trade name certificates are renewable.
      - key: trade_name_rules
        section: "Registering the trade name"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          The trade name must be followed by the legal-form acronym (such as LLC, EST, PJSC,
          PrJSC); must not violate public morals or public order; must be compatible with the
          type of activity and the legal status of the business; must not contain names of any
          religion or governing authority, nor names or logos of external bodies; and must not
          have been previously registered.
      - key: initial_approval_meaning
        section: "Getting the initial approval"
        excerpt: quote
        states_requirement: false
        text: >-
          An initial approval means that the UAE Government has no objection for the business
          to be established in the country. It also allows the investor to proceed with the next
          steps in setting up a business. It does not, however, grant the authority to run or
          practice the business activity.
      - key: initial_approval_prerequisites
        section: "Getting the initial approval"
        excerpt: quote
        states_requirement: true
        text: >-
          Foreign investors must obtain the approval of the General Directorate of Residency and
          Foreigners’ Affairs before getting the initial approval. Some activities require
          additional approvals from government entities related to that particular business
          before applying for the initial approval.
      - key: moa_lsa
        section: "Signing the MOA and LSA"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          Depending on the legal form, a completed and signed Memorandum of Association (required
          for limited partnerships, LLCs, PJSCs and PrJSCs) or a local service agent agreement is
          required; MoAs are prepared and attested by UAE-based law firms, courts and notary
          public. The page also states that businesses owned completely by non-GCC residents
          require a local service agent from the UAE under an attested agreement.
      - key: business_location
        section: "Selecting a business location"
        excerpt: quote
        states_requirement: true
        text: >-
          All businesses in the UAE must have a physical address to operate. The business
          premises and location must comply with the requirements defined by the respective
          emirate’s Department of Economic Development, as well as the land planning regulations
          of the local municipalities. Office and warehouse rental agreement must be provided.
      - key: licence_documents
        section: "Collecting the business licence"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          After completing the earlier steps, the investor collects the business licence from the
          economic department's service centres or websites. Documents listed for all legal forms
          are the initial approval receipt and previously submitted documents, the lease contract
          (the page cites RERA attestation in Dubai), a duly attested Memorandum of Association,
          approvals from other government entities as required, and a duly attested service agent
          contract for civil establishments and companies 100 per cent owned by non-GCC nationals.

  - key: uae.full_foreign_ownership_of_commercial_companies
    title: "Full foreign ownership of commercial companies"
    url: https://u.ae/en/information-and-services/business/Doing-business/doing-business-on-the-mainland/full-foreign-ownership-of-commercial-companies
    authority: authority.uae_government
    source_type: guidance_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: 2026-04-06
    topics: [company_formation]
    verification: fetched
    passages:
      - key: full_ownership
        section: "Full foreign ownership of commercial companies"
        excerpt: quote
        states_requirement: false
        text: >-
          The UAE Government amended the Commercial Companies Law, granting foreign investors full
          ownership of specific businesses. This means that foreign investors’ share will not be
          limited to 49 per cent as before; instead, it can be as much as 100 per cent.
      - key: decree_law
        section: "Federal law on commercial companies"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          Federal Decree-Law No. 26 of 2020, in effect from early 2021, permitted 100 per cent
          foreign ownership of mainland companies and removed the requirement for 51 per cent
          Emirati ownership or a local agent for most business activities, while strategic sectors
          still require approvals; the changes were later consolidated by Federal Decree-Law No. 32
          of 2021 on Commercial Companies. It also removed the obligation for branches of foreign
          companies to appoint a UAE national service agent.
      - key: restricted_activities
        section: "Restricted activities"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          The Cabinet determines activities of strategic impact and may set licensing requirements
          for them, including restrictions on foreign ownership. Activities listed as not allowed
          to be fully foreign-owned include security, defence and military activities;
          telecommunications; banks, exchange, financing, insurance and note or coin production;
          commercial agencies; Hajj and Umrah organising; Holy Quran recitation institutes; and
          fish, natural pearl and marine animal catching.

