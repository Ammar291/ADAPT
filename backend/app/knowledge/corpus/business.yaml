          The Online Registry Solution is ADGM's digital platform that lets applicants register
          and maintain their company through online services without needing to visit the ADGM
          offices.
      - key: registry_functions
        section: null
        excerpt: paraphrase
        states_requirement: false
        text: >-
          The Online Registry Solution is used to register and incorporate entities and to search
          for entities and their details; other registration services, such as charges and the
          recognition of auditors, are also fulfilled digitally through it.

  - key: adgm.non_financial_incorporation_guide
    title: "Non-Financial Incorporation Guide"
    url: https://assets.adgm.com/download/assets/Application+Guide-Non-Financial-Incorporation.pdf/b6d2d2c65aff11ef9f105a09db51114c
    authority: authority.adgm
    source_type: guidance_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: null
    topics: [adgm, company_formation]
    verification: fetched
    notes: >-
      PDF published by ADGM; the document itself carries no date, but its PDF metadata shows it
      was created in May 2020, so screen names and the portal address may be out of date.
    passages:
      - key: scope
        section: "Introduction"
        excerpt: quote
        states_requirement: false
        text: >-
          You can use this guide if you are registering a new company and your activity is
          non-financial.
      - key: documents_to_prepare
        section: "Let's Get Started!"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          Documents to have ready: information about the business; a resolution (template
          available); Articles of Association (model articles available); a signed lease
          agreement; passport copies of directors, authorised signatories and individual
          shareholders; a copy of the valid UAE residence visa of authorised signatories;
          certified true copies of the certificate of registration or incorporation of any body
          corporate directors or shareholders; data processor details (if appointed); and, if the
          entity is subject to anti-money-laundering regulations, the MLRO's CV and an AML manual.
          The Registrar can request further documentation at any time.
      - key: signatory_residency
        section: "Let's Get Started!"
        excerpt: quote
        states_requirement: true
        text: >-
          At least one signatory must be GCC national or hold a valid UAE residence visa.
      - key: digital_application
        section: "Where to access the application form"
        excerpt: quote
        states_requirement: true
        text: >-
          Applications are only accepted digitally and can be accessed at
          www.registration.adgm.com and you have to complete the following forms: a) Business
          Application and b) Application to Incorporate a Company Limited by Shares
      - key: application_sequence
        section: "Application to Incorporate a Private Company Limited by Shares"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          The applicant first creates a user and submits a Business Application (Online Services,
          Companies, Pre-Registration). The Application to Incorporate a Private Company Limited by
          Shares can be completed once the Business Application has been approved.
      - key: form_sections
        section: "Application form sections"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          The incorporation application has ten sections: General Details, Addresses, Authorised
          Signatories, Director, Secretary, Shares and Shareholders, Anti-Money Laundering, Data
          Protection, Beneficial Owners, and Review. Company names can be reserved in advance and
          selected in the form.
      - key: physical_address
        section: "Section 2: Addresses"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          Having a physical address in ADGM is described as a core principle to being granted a
          commercial licence. Applicants enter the registered office address on Al Maryah Island
          and upload a signed office lease agreement.

  - key: adgm.tech_startup_licence_faq
    title: "Frequently Asked Questions (FAQs) | ADGM"
    url: https://adgm.com/faqs/adgm-tech-start-up-commercial-licence
    authority: authority.adgm
    source_type: faq
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: null
    topics: [adgm, company_formation]
    verification: search_snippet
    notes: >-
      Tech Start-up Commercial Licence FAQ. Page blocked by a Cloudflare challenge; passages
      paraphrase search-result snippets returned alongside this URL. Review on the live page.
    passages:
      - key: hub71_approval_letter
        section: null
        excerpt: paraphrase
        states_requirement: true
        text: >-
          Applications for the ADGM tech start-up licence must be accompanied by a Hub71 approval
          (eligibility) letter. Applicants must first apply to Hub71 for this letter; applications
          without it are not accepted (as of July 2024).
      - key: office_space
        section: null
        excerpt: paraphrase
        states_requirement: true
        text: >-
          Tech start-ups must maintain an ADGM office address: physical office space on Al Maryah
          Island with at least one dedicated desk or office (hot-desks are not accepted), evidenced
          by an executed lease agreement or membership agreement.

  - key: adgm.ra_work_permit_guide
    title: "Work Permit Guide – Registration Authority (August 2025)"
    url: https://assets.adgm.com/download/assets/ADGM+RA+Work+Permit+Guide.pdf/3b295b4487ce11ef8ad1064e6f3513dc
    authority: authority.adgm
    source_type: guidance_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: null
    topics: [adgm, residency]
    verification: fetched
    notes: >-
      Cover dated "August 2025" (month only). The guide describes itself as non-binding and
      cites the ADGM Employment Regulations 2019.
    passages:
      - key: work_permit_definition
        section: "Part1: Work Permits"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          An ADGM work permit grants an employee of an ADGM Licensed Person permission to work in
          or from the geographical jurisdiction of ADGM. The ADGM Registration Authority is the
          sole issuing authority for work permits.
      - key: employer_responsibility
        section: "Part1: Work Permits"
        excerpt: quote
        states_requirement: true
        text: >-
          As per the Regulations, the ADGM Licensed Person shall be responsible for obtaining,
          maintaining and paying the cost of an employee's work permit and, as applicable, the
          UAE residency visa and UAE identity card.
      - key: establishment_card_prerequisite
        section: "Part1: Work Permits"
        excerpt: quote
        states_requirement: true
        text: >-
          In order for an ADGM Licensed Person to obtain an employment visa/Work Permit for its
          employees, the entity must hold a valid establishment card and an E-Channels account
          with ADGM.
      - key: accessadgm_channel
        section: "Part1: Work Permits"
        excerpt: quote
        states_requirement: false
        text: >-
          The Corporate Relations division of the ADGM Registration Authority processes
          applications for Work Permits for employees of ADGM Licensed Persons through the
          ACCESSADGM portal.
      - key: sponsored_employees
        section: "1) Employees sponsored by ADGM Licensed Persons"
        excerpt: quote
        states_requirement: false
        text: >-
          This category covers employees who are not UAE/GCC nationals and are sponsored by an
          ADGM Licensed Person. Employment visas for these employees shall be facilitated by the
          ADGM Registration Authority. The Work Permit will be issued upon the issuance of the
          employment visa.
      - key: uae_gcc_nationals
        section: "b) UAE & GCC Nationals"
        excerpt: quote
        states_requirement: true
        text: >-
          UAE and GCC nationals are not required to obtain an employment visa; however, the ADGM
          Licensed Person must obtain a Work Permit for those employees that enables them to work
          in the geographical jurisdiction of ADGM.
      - key: temporary_work_permits
        section: "Part 2: Temporary Work Permits"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          An ADGM Licensed Person must apply for a temporary work permit for any non-employee
          engaged to perform work or provide services in ADGM. Recipients must hold a valid UAE
          residence visa (valid for longer than the permit period) or be UAE/GCC nationals.

  # --- Corporate tax: FTA ---------------------------------------------------------------
  - key: fta.corporate_tax_registration
    title: "Corporate Tax Registration"
    url: https://tax.gov.ae/en/services/corporate.tax.registration.aspx
    authority: authority.fta
    source_type: service_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: 2026-08-19
    topics: [corporate_tax]
    verification: fetched
    passages:
      - key: service_description
        section: "Service Description"
        excerpt: quote
        states_requirement: false
        text: >-
          This service enables all persons subject to Corporate Tax to submit a registration
          application to the Federal Tax Authority, in order to obtain a Corporate Tax
          Registration Number and comply with the applicable tax obligations.
      - key: juridical_persons_must_register
        section: "FAQs"
        excerpt: quote
        states_requirement: true
        text: >-
          All juridical persons subject to Corporate Tax are required to register with the
          Federal Tax Authority and obtain a Corporate Tax Registration Number in accordance with
          the provisions of the Federal Tax Authority Decision No. (3) of 2024 regarding the
          specified timeline for the registration of persons subject to Corporate Tax and
          Business Tax.
      - key: natural_persons_must_register
        section: "FAQs"
        excerpt: quote
        states_requirement: true
        text: >-
          Natural persons are required to register for Corporate Tax if they conduct a business
          or business activity in the United Arab Emirates and their annual revenues exceed the
          registration threshold specified under the Corporate Tax Law.
      - key: channel_emaratax
        section: "Channels and working hours"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          The service is delivered through the EmaraTax platform, available 24 hours a day, 7 days
          a week. A banner on the FTA site states that FTA services are only available through
          UAE PASS.
      - key: required_documents
        section: "Required Documents and Forms"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          Required documents: the Certificate of Incorporation, Memorandum of Association or
          Partnership Agreement (if available); the Commercial Registration Certificate or any
          official document issued by the licensing authority; a valid trade licence, including
          branch licences if applicable; the Emirates ID and passport of any owner holding more
          than 25 per cent and of authorised signatories; and proof of authorisation for the
          signatory. Files are uploaded as PDF.
      - key: procedure_steps
        section: "Procedures and Steps"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          Register and activate an EmaraTax account, open the account dashboard, create a new
          Taxable Person profile, open the Taxable Person account, choose Register from the
          Corporate Tax action menu, then complete the application and submit it for review.

  # --- ADRO: Golden Visa for entrepreneurs -------------------------------------------------
  - key: adro.golden_visa_entrepreneurs
    title: "Abu Dhabi Golden Visa for Entrepreneurs"
    url: https://www.adro.gov.ae/en/Visas/Types-of-Visas/Abu-Dhabi-Golden-Visa/Entrepreneurs
    authority: authority.adro
    source_type: guidance_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: null
    topics: [residency, company_formation, newcomer]
    verification: fetched
    notes: >-
      Revenue and sale-value thresholds stated on the page are deliberately not recorded.
    passages:
      - key: overview
        section: "Abu Dhabi Golden Visa for Entrepreneurs"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          The Abu Dhabi Golden Visa for Entrepreneurs has a duration of 10 years. The page says
          business owners relocating to Abu Dhabi can sponsor themselves, their family and
          employees with a long-term visa.
      - key: eligibility
        section: "Criteria"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          Eligible applicants are (a) an owner or partner whose pioneering business project
          concept has been approved by an approved business incubator, the Ministry of Economy,
          ICP or a competent local authority; or (b) an owner or partner in a pioneering project
          in an approved sector, classified as an SME and meeting the minimum annual revenue
          stated on the page; or (c) a founder of previous pioneering project(s) sold for at least
          the total value stated on the page, subject to approval.
      - key: incubator_nomination
        section: "Requirements"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          All three entrepreneur routes require a nomination issued by a business incubator in the
          UAE. Applications made through the Abu Dhabi Residents Office web app are sent
          automatically to the relevant business incubator for nomination.
      - key: owner_partner_documents
        section: "Requirements"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          An owner or partner in a pioneering project provides a trade licence, financial or
          social certificates (required by Hub71 and Ma'an respectively), audited financial
          statements for the past two years, a company profile or deck, a LinkedIn profile, and
          the business incubator nomination.
      - key: how_to_apply
        section: "How to Apply"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          UAE residents apply for Golden Visa nomination through the Abu Dhabi Residents Office
          (the page's apply link points to a TAMM Golden Visa nomination service); non-UAE
          residents are asked to contact e.management@adio.gov.ae to apply for nomination.
