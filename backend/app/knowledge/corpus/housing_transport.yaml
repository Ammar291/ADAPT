# Housing / tenancy and transport / driving in Abu Dhabi.
# Curated official sources; see README.md in this directory for the format and rules.
# Researched and read on 2026-09-29. No fees, processing times or penalty amounts recorded.

sources:
  # ---------------------------------------------------------------- housing / tenancy
  - key: uae.leasing_a_property_in_the_uae
    title: "Leasing a property in the UAE"
    url: https://u.ae/en/information-and-services/moving-to-the-uae/leasing-a-property-in-the-uae
    authority: authority.uae_government
    source_type: guidance_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: 2026-01-20
    topics: [housing, tenancy, newcomer]
    verification: fetched
    passages:
      - key: abu_dhabi_landlord_registers_tawtheeq
        section: "Registering lease agreements"
        excerpt: quote
        states_requirement: true
        text: >-
          In Abu Dhabi, landlords have to register lease contract in the Tawtheeq system,
          which is the city’s register for tenancy contracts.
      - key: registration_needed_for_utilities
        section: "Registering lease agreements"
        excerpt: quote
        states_requirement: true
        text: >-
          Lease agreements between landlords and tenants must be registered by the respective
          authority in each emirate. Registration of lease contracts is compulsory to connect
          the utility services. This includes water, electricity, gas and telecommunications
          services.
      - key: municipality_fee_on_utility_bill
        section: "Registering lease agreements"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          In Abu Dhabi, once the lease contract has been registered in Tawtheeq a municipality
          fee is levied, and this amount is added to the tenant's monthly water and electricity
          bill across 12 months.
      - key: tenant_identification_documents
        section: "Rent rates"
        excerpt: quote
        states_requirement: true
        text: >-
          To conclude a lease contract with the landlord and/or real estate agent, the tenant
          must provide identification documents which include a copy of his passport, a valid
          residence visa and Emirates ID, in addition to post-dated cheques covering payments
          for the agreed lease period.
      - key: abu_dhabi_rental_disputes
        section: "Rental disputes"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          For rental disputes between a landlord and a tenant in Abu Dhabi, the page directs
          people to the Rent Dispute Settlement Committee in Abu Dhabi.

  - key: adrec.home
    title: "Home"
    url: https://adrec.gov.ae/en
    authority: authority.adrec
    source_type: portal_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
