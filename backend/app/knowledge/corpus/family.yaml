    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: null
    topics: [family_residency, residency]
    verification: search_snippet
    passages:
      - key: first_step
        section: null
        excerpt: paraphrase
        states_requirement: true
        text: >-
          Opening a sponsor file is described as the first and essential step that allows a
          sponsor to issue visas and submit residency permit applications for family members
          or domestic workers.
      - key: opened_once
        section: null
        excerpt: paraphrase
        states_requirement: false
        text: >-
          The sponsor file only needs to be opened once; it is then used to access and
          complete these visa and residency services. The service is provided by ICP through
          TAMM.

  # ---------------------------------------------------------------------------
  - key: mofa.documents_attestation
    title: "Attestation of Official Documents and Certificates"
    url: https://www.mofa.gov.ae/en/services/attestation
    authority: authority.mofa
    source_type: service_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: null
    topics: [attestation]
    verification: fetched
    passages:
      - key: about
        section: "About this service"
        excerpt: quote
        states_requirement: false
        text: >-
          This service enables customers to obtain the attestation of the Ministry of Foreign
          Affairs and the UAE Mission in the destination country. Attestation certifies the
          authenticity of the signatures and seals on documents issued within or outside the
          United Arab Emirates.
      - key: issued_outside_uae_steps
        section: "Service process — Second: Documents Issued Outside the United Arab Emirates"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          For documents issued outside the UAE: sign in to apply for the service, select
          "Attestation through UAE Missions Abroad" and complete the required information, pay
          the applicable fees, and receive a confirmation message with the application
          reference number.
      - key: missions_availability
        section: "Service process — Second: Documents Issued Outside the United Arab Emirates"
        excerpt: quote
        states_requirement: false
        text: >-
          This service is available through selected UAE Missions abroad. Please visit the
          website of the UAE Mission in your country of residence to confirm whether the
          service is available electronically and submit your application. If the service is
          not available online, please visit the UAE Mission in person.
      - key: no_uae_mission
        section: "Conditions of Use"
        excerpt: quote
        states_requirement: false
        text: >-
          If there is no UAE Mission in the country where you are located, please contact the
          Ministry through the Contact Center or the Contact Us page.
      - key: courier_route_document_rules
        section: "Required Documents — Attestation Through an Approved Courier Service Provider"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          For the courier-based route, the original document must be in Arabic or English, or
          accompanied by a legally certified translation; it must be certified or attested by
          the relevant competent authorities where applicable; and it must not be laminated.
      - key: service_centre
        section: "Other useful information"
        excerpt: quote
        states_requirement: false
        text: >-
          You may also visit a service centre in the United Arab Emirates to obtain the service
      - key: uae_pass_and_channels
        section: "FAQs — Before you begin your application"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          The page's Digital Attestation FAQ says applications are submitted through the
          Ministry of Foreign Affairs website or the UAE MOFA smart app, and that UAE PASS is
          required to sign in and access the service.

  # ---------------------------------------------------------------------------
  - key: mofa.faqs
    title: "FAQ"
    url: https://www.mofa.gov.ae/en/faqs
    authority: authority.mofa
    source_type: faq
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: null
    topics: [attestation]
    verification: fetched
    passages:
      - key: channels
        section: "What are the channels for providing Official Documents, Certificates and Commercial Invoices attestation service?"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          Attestation channels listed: the MoFA website (www.mofa.gov.ae), the UAE MOFA smart
          mobile app, and UAE embassies and consulates abroad.
      - key: attestation_requirements
        section: "What are the requirements for attestation?"
        excerpt: paraphrase
        states_requirement: true
        text: >-
          Requirements for attestation: the original document in English or Arabic (or an
          official translation of it); the document must be attested by the appropriate
          governing bodies prior to submission; and the document must not be laminated.
      - key: issued_outside_uae_chain
        section: "What are the prerequisites of attesting documents?"
        excerpt: quote
        states_requirement: true
        text: >-
          For documents issued outside the UAE: Original documents must be attested by the
          Ministry of Foreign Affairs of the issuing country. Documents can then be attested by
          the UAE Embassy or Consulate in the issuing country by applying through MoFA online
          channels. Original documents must be attested in the UAE through the Ministry’s
          official website www.mofa.gov.ae or the UAE MOFA smart application.
      - key: personal_documents_in_scope
        section: "What are the types of documents that can be attested through MoFA’s e-channels?"
        excerpt: paraphrase
        states_requirement: false
        text: >-
          Individual affairs documents that can be attested through MoFA's e-channels include,
          among others, birth certificates and marriage certificates.
      - key: centres_closed
        section: "Where are Customer Happiness Centres (Attestation Centres) located within the UAE?"
        excerpt: quote
        states_requirement: false
        text: >-
          The Ministry of Foreign Affairs provides all its services electronically through its
          website and smartphone application only. All customers can now submit all
          transactions related to MoFA’s attestation service through the Ministry’s official
          website www.mofa.gov.ae and the UAE MOFA smart application, upon fulfilling all terms
          and conditions. MoFA Customer Happiness Centres are closed,
          in line with the directives of the UAE visionary leadership towards improving
          government services and customer experience.
      - key: courier_collection_in_uae
        section: "How can I send my documents to MoFA after successful payment of attestation fees inside the UAE?"
        excerpt: quote
        states_requirement: false
        text: >-
          If you selected UAE as a location for attestation, you will be asked to select the
          type of courier service desired for the service. Once you have successfully paid for
          the transaction, a courier service representative will contact you to collect your
          documents.
      - key: on_behalf
        section: "Can someone attest my documents on my behalf?"
        excerpt: quote
        states_requirement: false
        text: >-
          Anyone can attest documents on your behalf.

  # ---------------------------------------------------------------------------
  - key: uae.preparing_to_work
    title: "Preparing to work"
    url: https://u.ae/en/information-and-services/jobs/Sector-of-employment/employment-in-the-private-sector/preparing-to-work
    authority: authority.uae_government
    source_type: guidance_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: 2026-09-24
    topics: [attestation, newcomer]
    verification: fetched
    passages:
      - key: where_mofa_attests
        section: "Attestation of academic certifications"
        excerpt: quote
        states_requirement: false
        text: >-
          The UAE's Ministry of Foreign Affairs provides certificate attestation services both
          inside the UAE (via digital channels) and abroad (through UAE embassies and
          consulates).
      - key: document_types
        section: "Attestation of academic certifications"
        excerpt: quote
        states_requirement: false
        text: >-
          MoFA attests various individual affairs’ documents including birth, death and
          marriage certificates; as well as, commercial documents such as contracts and
          agreements, minutes of meeting, trademark registrations and company closure
          documents.
      - key: issued_outside_uae
        section: "Attestation of academic certifications"
        excerpt: quote
        states_requirement: true
        text: >-
          For documents issued outside the UAE, the original document should be attested by
          Ministry of Foreign Affairs in the issuing country. Afterwards, the document can be
          attested by a UAE Embassy or Consulate in that country by applying through digital
          channels.
      - key: no_mission
        section: "Attestation of academic certifications"
        excerpt: quote
        states_requirement: false
        text: >-
          If there is no UAE mission present in that country, applicants may contact MoFA for
          assistance via its call centre or approved channels.
      - key: mofa_channels
        section: "Attestation of academic certifications"
        excerpt: quote
        states_requirement: false
        text: >-
          MoFA attestation services are available via the official website and its app
          UAEMOFA available on Android and iOS.

  # ---------------------------------------------------------------------------
  - key: uae.getting_a_health_insurance
    title: "Getting a health insurance"
    url: https://u.ae/en/information-and-services/health-and-fitness/Healthcare-access-and-insurance/getting-a-health-insurance
    authority: authority.uae_government
    source_type: guidance_page
    language: en
    retrieved_at: 2026-09-29
    effective_date: null
    last_updated: 2026-09-08
    topics: [health_insurance, family_residency]
    verification: fetched
    passages:
      - key: abu_dhabi_sponsor_family_cover
        section: "Health insurance for resident expatriates"
        excerpt: quote
        states_requirement: true
        text: >-
          In the emirate of Abu Dhabi, employers and sponsors are responsible for the
          providing health insurance coverage for their employees and their families
          (1 spouse and 3 children under 18 years).
      - key: coverage_extent
        section: "Health insurance for resident expatriates"
        excerpt: quote
        states_requirement: false
        text: >-
          The extent of coverage for employers and their dependents is determined by the
          employee's salary, designation etc. The extent of coverage and type of policy/scheme
          would determine the cost of your medical services.
      - key: private_sector_prerequisite
        section: "Health insurance for private sector employees and domestic workers"
        excerpt: quote
        states_requirement: true
        text: >-
          From 1 January 2025, employers are required to purchase health insurance policy as a
          prerequisite for applying for the issuance or renewal of residency permits of private
          sector employees and domestic workers. The system is implemented on a mandatory basis
          in Abu Dhabi and Dubai, and will extend to private sector workers in Sharjah, Ajman,
          Umm Al Quwain, Ras Al Khaimah, and Fujairah.
