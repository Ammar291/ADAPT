  - key: tamm.open_sponsorship_file
    title: "Open a Sponsorship File"
    url: https://www.tamm.abudhabi/en/life-events/individual/Identity-Citizenship-Human-Resources/Identity-Citizenship/RequesttoOpenaSponsorshipFile
    authority: authority.abu_dhabi_government
    source_type: service_page
