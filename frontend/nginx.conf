# ADAPT web server: serves the PWA and proxies /api to the backend (same origin, so the
# httpOnly session cookie and Server-Sent Events work without CORS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    # connect-src includes OpenAI only for the WebRTC SDP exchange of voice sessions
    # (authorised by a short-lived key minted by the backend).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://api.openai.com; frame-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        # Server-Sent Events: stream immediately, keep long-lived connections open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The service worker and manifest must always be revalidated so updates roll out.
    location = /sw.js { expires -1; }
    location = /manifest.webmanifest { expires -1; }

    # Hashed build assets never change.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # SPA routes fall back to the app shell.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
